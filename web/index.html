<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#170d02" />
    <meta name="description" content="线下足浴本地部署 SaaS 系统 — 足韵 yuwen-spa" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <title>足韵 yuwen-spa</title>
    <!-- 字体自托管（unicode-range 分片，仅下载页面用到的字块；不依赖任何外部 CDN） -->
    <link href="/fonts/lxgw/lxgwwenkai-regular.css" rel="stylesheet" />
    <link href="/fonts/lxgw/lxgwwenkai-bold.css" rel="stylesheet" />
    <link href="/fonts/ma-shan-zheng/400.css" rel="stylesheet" />
  </head>
  <body class="bg-paper dark:bg-[#0e0e0d] text-ink dark:text-[#e8e6df] antialiased">
    <div id="root"></div>
    <script>
      // 启动前恢复主题，避免深浅色闪烁
      try {
        var s = localStorage.getItem('yuwen-dark-mode')
        var dark = s !== null ? s === 'true' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) { document.documentElement.classList.add('dark') }
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // 移除旧 Service Worker（离线壳会锁死更新），顺带清掉历史 Cache Storage
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister())).catch(() => {})
          if (window.caches) caches.keys().then((ks) => ks.forEach((k) => caches.delete(k))).catch(() => {})
        })
      }
    </script>
  </body>
</html>
